name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle testDebugUnitTest assembleRelease
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'build/outputs/aar/*.aar'
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/outputs/aar/*.aar --generate-notes --verify-tag
      - name: GitHub Packages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: gradle publishReleasePublicationToGitHubPackagesRepository
      - name: Import signing key
        if: env.SIGNING_KEY != ''
        run: |
          command -v gpg >/dev/null || brew install gnupg
          printf '%s' "$SIGNING_KEY" | gpg --batch --import
      # Maven Central via the Central Portal OSSRH staging API: upload, then the manual-upload POST
      # that closes and publishes the staging repository. Skipped when the secrets are unset or the
      # version is already on Central.
      - name: Maven Central
        if: env.MAVEN_CENTRAL_USERNAME != ''
        run: |
          V="${GITHUB_REF_NAME#v}"
          if curl -fsI "https://repo1.maven.org/maven2/io/github/watchtowerobservability/watchtower-android/$V/" >/dev/null; then
            echo "watchtower-android $V is already on Maven Central"; exit 0
          fi
          gradle publishReleasePublicationToMavenCentralRepository
          AUTH=$(printf '%s:%s' "$MAVEN_CENTRAL_USERNAME" "$MAVEN_CENTRAL_PASSWORD" | base64 | tr -d '\n')
          curl -fS -X POST -H "Authorization: Bearer $AUTH" \
            "https://ossrh-staging-api.central.sonatype.com/manual/upload/defaultRepository/io.github.watchtowerobservability?publishing_type=automatic"
