name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle testDebugUnitTest assembleRelease
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'build/outputs/aar/*.aar'
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/outputs/aar/*.aar --generate-notes --verify-tag
      - name: GitHub Packages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: gradle publishReleasePublicationToGitHubPackagesRepository
      # Maven Central: runs only when the owner has set the secrets (MAVEN_CENTRAL_*, SIGNING_*).
      - name: Maven Central
        if: ${{ env.MAVEN_CENTRAL_USERNAME != '' }}
        run: gradle publishReleasePublicationToMavenCentralRepository
