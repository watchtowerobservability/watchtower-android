name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle testDebugUnitTest assembleRelease
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'build/outputs/aar/*.aar'
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/outputs/aar/*.aar --generate-notes --verify-tag
